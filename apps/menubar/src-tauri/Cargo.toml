[package]
name = "mapper"
version = "0.1.1"
description = "Menu bar SSH port forwarder"
edition = "2021"

[lib]
name = "mapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ctrlc = { version = "3", features = ["termination"] }
open = "5"
wait-timeout = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
